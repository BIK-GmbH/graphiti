name: sync-upstream

# Opens (never merges) a PR bringing getzep/graphiti:main into bik/main, so
# BIK patches are forward-ported deliberately rather than auto-applied.
# First-party only: actions/checkout (GitHub-official, SHA-pinned) + native
# git/gh. No third-party marketplace actions, per the supply-chain finding in
# cdb_tqs .ai/issues/470 (tj-actions CVE-2025-30066).

on:
  schedule:
    - cron: "0 6 1 * *"   # 1st of each month at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  open-upstream-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (bik/main)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: bik/main
          fetch-depth: 0

      - name: Fetch upstream and stage a throwaway sync branch
        run: |
          git remote add upstream https://github.com/getzep/graphiti.git
          git fetch --no-tags upstream main
          # Force-push is safe here: this is a disposable sync branch, NOT
          # bik/main. The patch branch (bik/main) is never force-pushed.
          git push origin refs/remotes/upstream/main:refs/heads/automated/upstream-sync --force

      - name: Open or refresh the upstream PR (never auto-merge)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh pr list --base bik/main --head automated/upstream-sync --state open --json number --jq 'length')
          if [ "$OPEN" = "0" ]; then
            gh pr create \
              --base bik/main \
              --head automated/upstream-sync \
              --title "chore: sync upstream getzep/graphiti -> bik/main" \
              --body "Automated upstream sync. **Do NOT auto-merge.** Review the diff for BIK patch conflicts, forward-port deliberately, then cut a new bik tag (e.g. v0.22.0-bik.N). Generated by .github/workflows/sync-upstream.yml."
          else
            echo "Upstream-sync PR already open (#$OPEN); branch refreshed in place."
          fi